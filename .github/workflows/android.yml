name: Build APK

# Le SDK Android est préinstallé sur les runners GitHub : c'est ce qui permet
# de produire l'APK sans rien installer sur ta machine.
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Garde-fou : un motif .gitignore non ancré a déjà fait disparaître
      # tout un paquet Java du dépôt. L'échec de compilation qui en découle
      # est déroutant ; mieux vaut le dire ici, clairement.
      - name: Vérifier que toutes les sources Android sont versionnées
        run: |
          missing=$(git ls-files --others --ignored --exclude-standard -- android/ || true)
          if [ -n "$missing" ]; then
            echo "::error::Des fichiers du projet Android sont ignorés par .gitignore :"
            echo "$missing"
            exit 1
          fi
          echo "Toutes les sources Android sont versionnées."

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Version explicitement supportée par AGP 8.5 : le runner fournit
      # une version plus récente, qui compile mais signale des API dépréciées.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # On produit le variant debug : il est signé avec la clé de debug, donc
      # installable directement. Un APK release non signé ne s'installe pas.
      - name: Compiler l'APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: mercari-sniper-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
