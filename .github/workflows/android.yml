name: Build APK

# Le SDK Android est préinstallé sur les runners GitHub : c'est ce qui permet
# de produire l'APK sans rien installer sur ta machine.
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # On produit le variant debug : il est signé avec la clé de debug, donc
      # installable directement. Un APK release non signé ne s'installe pas.
      - name: Compiler l'APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: mercari-sniper-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
