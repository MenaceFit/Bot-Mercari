# ══════════════════════════════════════════════════════════════════════
#  BUyee Radar — configuration
#
#  AUCUN SECRET ICI. Jetons Telegram et webhook Discord vont dans .env
#  (git-ignoré). Un test du projet échoue si un secret peut atteindre
#  ce fichier.
# ══════════════════════════════════════════════════════════════════════

log_level: INFO
api_host: 127.0.0.1
api_port: 8899

# ── Mots-clés ─────────────────────────────────────────────────────────
#
#  name     nom lisible, affiché partout
#  search   ce qui est RÉELLEMENT envoyé à Buyee
#  include  ce qui doit se trouver dans le titre — filtré EN LOCAL (OU)
#  exclude  ce qui disqualifie l'annonce — filtré EN LOCAL
#  priority high = 2 s · medium = 5 s · low = 20 s
#  sources  vide = toutes les sources actives
#
#  Plusieurs mots-clés qui partagent un `search` ne coûtent QU'UNE requête.
#  Si cette requête large se met à perdre des annonces (sa page ne remonte
#  plus au scan précédent), le moteur la remplace automatiquement par des
#  requêtes précises. Voir core/query_optimizer.py.

keywords:
  - name: Nike Division
    search: [ナイキ]
    include: [ディビジョン, division]
    priority: high

  - name: Nike Trail
    search: [ナイキ]
    include: [トレイル, trail]
    exclude: [シューズ, スニーカー, shoes, sneakers, 靴]

  - name: Nike Gyakusou
    search: [ナイキ]
    include: [ギャクソウ, gyakusou]
    priority: high

  - name: Arcteryx Veilance
    search: [アークテリクス, arcteryx]
    include: [ヴェイランス, veilance]
    min_price: 8000
    priority: high

  - name: Under Armour Project Rock
    search: [アンダーアーマー, under armour]
    include: [プロジェクトロック, project rock]

# ── Sources Buyee ─────────────────────────────────────────────────────
#
#  `selectors` est REMPLI AUTOMATIQUEMENT par :
#
#      buyee-radar calibrate
#
#  Cette commande charge une vraie page de résultats, y détecte la
#  structure répétée, et te montre un échantillon de ce qu'elle a extrait
#  avant d'enregistrer. Tant que les sélecteurs sont vides, la source est
#  affichée « NEEDS_SELECTORS » dans le dashboard — jamais « en ligne »
#  alors qu'elle ne ramène rien.
#
#  Elle doit tourner d'une machine d'où buyee.jp est joignable.

sources:
  # ══ LA MÉTASOURCE ══════════════════════════════════════════════════
  #  Buyee expose lui-même une recherche transversale :
  #      https://buyee.jp/item/crosssearch/query/{mot-clé}
  #  et déclare ses sites supportés : JDirectItems Auction, JDirectItems
  #  Fleamarket, Rakuma, Mercari, LuxeWholeSale.
  #
  #  UNE requête couvre les CINQ. C'est le meilleur rapport
  #  couverture/budget du système : commence par celle-ci.
  #  Chaque résultat est rendu à sa vraie marketplace (l'attribution se
  #  fait sur le namespace de l'URL), donc le flux reste étiqueté
  #  « Mercari », « Rakuma »… et pas « crosssearch ».
  crosssearch:
    enabled: true
    max_concurrent: 4
    page_size: 60
    selectors: {}

  # ══ LES NAMESPACES DÉDIÉS ══════════════════════════════════════════
  #  Complémentaires du cross-search : ils permettent de paginer et de
  #  trier source par source, donc de rattraper un trou sur une seule
  #  marketplace sans re-balayer les autres.
  mercari:
    enabled: false        # keyword= attesté par de nombreuses URL indexées
    max_concurrent: 4
    page_size: 60
    selectors: {}

  rakuma:
    enabled: false        # chemin de recherche déduit, pas observé
    max_concurrent: 3
    selectors: {}

  jdirectitems_auction:   # ex-Yahoo! Auctions — le mieux attesté
    enabled: false
    max_concurrent: 3
    selectors: {}

  jdirectitems_fleamarket:  # ex-Yahoo!/PayPay Flea Market
    enabled: false        # chemin de recherche déduit, pas observé
    max_concurrent: 3
    selectors: {}

  # luxewholesale n'a pas de namespace propre connu : elle arrive par le
  # cross-search, ou pas du tout. Aucune URL n'a été inventée pour elle.

  # jdirectitems_shopping, rakuten, amazon et zozotown sont NON
  # SUPPORTÉES : ce sont des catalogues marchands (shop.buyee.jp, rangés
  # par boutique et par catégorie), absents de la liste cross-search de
  # Buyee. Une fiche produit de catalogue est durable et réapprovisionnée
  # — il n'y a pas de « nouvelle annonce » à détecter. Les activer ne
  # ferait rien : le moteur refuse de les démarrer et affiche le motif.

  # Sources simulées : hors ligne, pour essayer l'interface sans réseau.
  # Le préfixe « sim_ » est visible partout dans l'interface.
  sim_mercari:
    enabled: true
  sim_rakuma:
    enabled: true
  sim_jdirectitems_fleamarket:
    enabled: true
  sim_jdirectitems_auction:
    enabled: true

# ── Ordonnancement ────────────────────────────────────────────────────
scanner:
  interval_high: 2.0
  interval_medium: 5.0
  interval_low: 20.0

  # Requêtes/seconde, TOUTES sources confondues. Ajouter des mots-clés
  # répartit ce budget, il ne grandit pas tout seul. Le dashboard affiche
  # la cadence réellement tenue quand il ne suffit plus.
  budget_per_second: 8.0
  max_concurrency: 20

  jitter: 0.15             # ±15 %, désynchronise les requêtes
  max_catchup_pages: 3     # pages remontées UNIQUEMENT si un trou est vu
  warmup: true             # 1er passage silencieux, sinon spam au démarrage
  status_every: 60.0

# ── Filtres globaux ───────────────────────────────────────────────────
filters:
  min_price: null
  max_price: null
  max_age_seconds: 900

  exclude:
    - 香水
    - コスメ
    - 化粧品
    - オードパルファム
    - perfume
    - 空箱
    - 箱のみ
    - カタログ
    - ステッカー
  exclude_regex: []
  conditions: []

# ── Scoring et seuils de notification ─────────────────────────────────
#  0-49 NORMAL · 50-69 RARE · 70-89 VERY RARE · 90-100 ULTRA RARE
scoring:
  notify_min_score: 0      # 0 = tout arrive au dashboard
  discord_min_score: 50
  telegram_min_score: 70
  bargain_price: 6000      # en dessous, bonus « prix bas »
  expensive_price: 60000   # au-dessus, malus

# ── Devises ───────────────────────────────────────────────────────────
#  Aucun appel réseau par annonce (§10) : le taux est mis en cache.
#  Renseigner `fixed_rate` supprime tout appel réseau.
currency:
  target: EUR
  fixed_rate: null
  ttl_seconds: 21600
  allow_network: false

# ── Notifications ─────────────────────────────────────────────────────
notifications:
  console: true
  telegram_enabled: true   # jeton et chat dans .env
  telegram_photo: true
  telegram_silent: false
  discord_enabled: false
  max_queue: 500
  max_retries: 3

# ── Liens d'achat Buyee ───────────────────────────────────────────────
#  NON VÉRIFIÉS : buyee.jp était inaccessible pendant le développement.
#  Si un lien tombe à côté, corrige ici — pas dans le code.
buyee:
  enabled: true
  affiliate_id: ""
  templates: {}

# ── Stockage ──────────────────────────────────────────────────────────
storage:
  database: data/radar.db
  retention_days: 30
  dedup_capacity: 200000
  flush_every: 5.0
