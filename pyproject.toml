[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snipe"
version = "3.0.0"
description = "Scanner multi-marketplace temps réel centré sur Buyee (Mercari, Rakuma, JDirectItems)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "httpx[http2]>=0.27",      # client asynchrone HTTP/2, connexions réutilisées
    "cryptography>=42.0",      # signature DPoP (ES256) exigée par l'API Mercari
    "PyYAML>=6.0",             # configuration
    "selectolax>=0.3.21",      # parsing HTML des sources sans API
    # API du dashboard temps réel (buyee-radar) et dashboard web de la v2.
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
# Génération courante : scanner multi-marketplace centré sur Buyee, avec
# dashboard temps réel. Configuration : radar.yaml.
buyee-radar = "buyee_radar.main:main"
# Les générations précédentes restent installées et fonctionnelles ; elles
# ont leur propre fichier de configuration, elles ne se marchent pas dessus.
snipe = "snipe.main:main"
mercari-sniper = "mercari_sniper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
buyee_radar = ["config.example.yaml"]
snipe = ["config.example.yaml"]
mercari_sniper = ["web/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
